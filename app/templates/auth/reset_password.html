{% extends "base.html" %}
{% block title %}Reset Password — TechTrek{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="vertical-align:-.2em;margin-right:.2em" aria-hidden="true"><path d="M13 2L4.5 13.5H11L10 22L19.5 10.5H13L13 2Z"/></svg>TECHTREK</div>
      <p class="auth-title">Choose a new password</p>
    </div>

    <form method="post" action="/auth/reset-password/{{ token }}" id="reset-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label class="form-label" for="reset-password">New Password <span class="required">*</span></label>
        <input type="password" name="password" id="reset-password" class="form-input" placeholder="min 8 characters" required autofocus autocomplete="new-password">
        <div class="password-strength" aria-hidden="true">
          <div class="password-strength-fill" id="pwd-strength-bar" style="width:0%"></div>
        </div>
        <div class="field-error" id="err-password" role="alert"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reset-confirm">Confirm New Password <span class="required">*</span></label>
        <input type="password" name="confirm_password" id="reset-confirm" class="form-input" placeholder="Re-enter password" required autocomplete="new-password">
        <div class="field-error" id="err-confirm" role="alert"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:.5rem" id="reset-btn">Update Password</button>
    </form>

    <div class="auth-footer">
      <a href="/auth/login">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var form      = document.getElementById('reset-form');
  var passEl    = document.getElementById('reset-password');
  var confirmEl = document.getElementById('reset-confirm');
  var btn       = document.getElementById('reset-btn');

  function showError(id, msg) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle('visible', !!msg);
  }

  passEl.addEventListener('input', function() {
    var v = passEl.value;
    var score = 0;
    if (v.length >= 8) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    var bar = document.getElementById('pwd-strength-bar');
    var pct = (score / 4) * 100;
    var colours = ['#f43f5e','#f59e0b','#10b981','#00d4ff'];
    bar.style.width = pct + '%';
    bar.style.background = colours[Math.max(0, score - 1)] || colours[0];
    var msg = v.length === 0 ? '' : v.length < 8 ? 'Password must be at least 8 characters' : '';
    showError('err-password', msg);
    if (confirmEl.value) validateConfirm();
  });

  function validateConfirm() {
    var match = confirmEl.value === passEl.value;
    var msg = confirmEl.value.length > 0 && !match ? 'Passwords do not match' : '';
    showError('err-confirm', msg);
    return match || confirmEl.value.length === 0;
  }
  confirmEl.addEventListener('input', validateConfirm);

  form.addEventListener('submit', function(e) {
    var valid = true;
    if (passEl.value.length < 8) { showError('err-password', 'Password must be at least 8 characters'); valid = false; }
    if (!validateConfirm()) { valid = false; }
    if (passEl.value && confirmEl.value && passEl.value !== confirmEl.value) { showError('err-confirm', 'Passwords do not match'); valid = false; }
    if (!valid) { e.preventDefault(); return; }
    btn.classList.add('btn-loading');
    btn.disabled = true;
  });
})();
</script>
{% endblock %}
