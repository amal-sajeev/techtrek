{% extends "base.html" %}
{% block title %}Forgot Password — TechTrek{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-logo">&#9889; TECHTREK</div>
      <p class="auth-title">Reset your password</p>
      <p class="auth-subtitle">Enter the email address linked to your account and we'll send you a reset link.</p>
    </div>

    <form method="post" action="/auth/forgot-password" id="forgot-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label class="form-label" for="forgot-email">Email address</label>
        <input type="email" name="email" id="forgot-email" class="form-input" placeholder="you@domain.com" required autofocus autocomplete="email">
        <div class="field-error" id="err-forgot-email" role="alert"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:.5rem" id="forgot-btn">Send Reset Link</button>
    </form>

    <div class="auth-footer">
      Remembered it? <a href="/auth/login">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var form    = document.getElementById('forgot-form');
  var emailEl = document.getElementById('forgot-email');
  var btn     = document.getElementById('forgot-btn');

  function showError(id, msg) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle('visible', !!msg);
  }

  form.addEventListener('submit', function(e) {
    var v = emailEl.value.trim();
    if (!v || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
      showError('err-forgot-email', 'Please enter a valid email address');
      e.preventDefault();
      return;
    }
    btn.classList.add('btn-loading');
    btn.disabled = true;
  });

  emailEl.addEventListener('input', function() {
    if (emailEl.value) showError('err-forgot-email', '');
  });
})();
</script>
{% endblock %}
