<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — TechTrek</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #010409;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .offline-box {
      max-width: 420px;
    }
    .offline-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: .7;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: .75rem;
    }
    p {
      color: #8b949e;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      background: #00d4ff;
      color: #010409;
      border: none;
      padding: .65rem 1.5rem;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="offline-box">
    <div class="offline-icon">&#9889;</div>
    <h1>You're offline</h1>
    <p>It looks like you've lost your internet connection. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
